<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#14251d">
    <title>Kaiwa — trip drill</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="wizard-shell">
      <header class="wizard-header">
        <div>
          <p class="eyebrow">KAIWA · TRIP LOOP</p>
          <h1 id="app-title">One decision at a time.</h1>
        </div>
        <span id="offline-badge" class="offline-badge">Offline</span>
      </header>

      <div class="journey-rail" aria-hidden="true">
        <span id="journey-fill"></span>
      </div>
      <p id="wizard-context" class="wizard-context">Preparing your next exchange…</p>
      <p id="placeholder-warning" class="warning" hidden></p>
      <p id="loading" class="loading">Loading practice pack…</p>
      <p id="error" class="error" hidden></p>

      <section id="wizard-screen" class="wizard-screen" aria-live="polite" hidden></section>

      <nav id="wizard-actions" class="wizard-actions" aria-label="Current step actions" hidden>
        <button id="action-secondary" type="button" class="wizard-action wizard-action-secondary" hidden></button>
        <button id="action-primary" type="button" class="wizard-action wizard-action-primary" hidden></button>
      </nav>

      <input id="progress-import" type="file" accept="application/json,.json" hidden>
      <input id="content-import" type="file" accept="application/json,.json" hidden>
      <div id="toast" class="toast" role="status"></div>
    </main>

    <script type="module" src="./src/ui.js"></script>
  </body>
</html>
